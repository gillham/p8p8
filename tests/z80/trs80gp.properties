# For p8p8's tests: the trs80 target (the TRS-80 Model I and III with a DOS)
# as it is run in the emulator trs80gp, which tests/trs80run.sh starts.  It is
# made from the library's trs80 target (base), and differs in two things: the
# program's output also goes to the printer, and the program ends the
# emulator.  It is also an example of a target file of one's own:
#   p8c -srcdirs lib/targets/trs80 -target tests/z80/trs80gp.properties ...
base = ../../lib/targets/trs80/target.properties

# before the program ends: it tells trs80gp to stop (function 128 of its
# emulator extensions, which -ee turns on; without them nothing happens)
exit_hook = ld  bc,0\n\
    ld  a,128\n\
    out  ($47),a

# The console as in the trs80 target, and every character also to the
# printer: memory-mapped at $37e8 on the Model I (the ROM's byte at $0054 is 1
# there), port $f8 on the Model III; bit 7 of what is read there says busy.
# trs80gp -batch writes what is printed to trs80-printer.txt, which is how the
# tests see what a program prints.
console_out = push  af\n\
    ld  a,($0054)\n\
    dec  a\n\
    jr  nz,p8con_port\n\
    p8con_busy:\n\
    ld  a,($37e8)\n\
    rlca\n\
    jr  c,p8con_busy\n\
    pop  af\n\
    ld  ($37e8),a\n\
    jr  p8con_screen\n\
    p8con_port:\n\
    in  a,($f8)\n\
    rlca\n\
    jr  c,p8con_port\n\
    pop  af\n\
    out  ($f8),a\n\
    p8con_screen:\n\
    cp  10\n\
    jr  nz,p8con_out\n\
    ld  a,13\n\
    p8con_out:\n\
    jp  $0033

# (paths in the keys of the base are read from where this file is)
float_source = ../../lib/targets/z80/z80-float.c
library = ../../lib/targets/llvm16
run_command = tests/trs80run.sh {file}
