# For p8p8's tests: the trs80 target (the TRS-80 Model I with a DOS) as it is
# run in the emulator trs80gp, which tests/trs80run.sh starts.  What differs
# from the library's trs80 target: the program's output also goes to the
# printer, and the program ends the emulator.  It is also an example of a
# target file of one's own: p8c -target tests/z80/trs80gp.properties ...
#
# A Z80 machine: "cpu = z80" selects p8p8's own Z80 code generator, which writes
# assembly for z88dk's z80asm.  The program is a command file (.cmd) that is run
# from the DOS prompt; trs80gp runs it on the host.  The screen is the 64 by 16
# one at $3c00, and the console and the keys are the ROM's, which the two models
# share.  docs/TARGETS.md describes the keys.

cpu = z80
encoding = iso

# above the DOS, which has the memory up to $51ff
load_address = $5200
output_extension = .cmd
# a command file: the program in load records, then where it starts
output_format = cmd

# The program is called by the DOS and uses its stack, so there are no first
# instructions.  It ends by telling trs80gp to stop (function 128 of its
# emulator extensions, which -ee turns on; without them nothing happens) and,
# on a real machine, with a jump to the DOS's "ready" entry.
exit_code = ld  bc,0\n\
    ld  a,128\n\
    out  ($47),a\n\
    jp  $402d

# The console as in the trs80 target, and every character also to the
# printer, which is memory-mapped at $37e8 on the Model I (bit 7 of what is
# read there: busy).  trs80gp -batch writes what is printed to
# trs80-printer.txt, which is how the tests see what a program prints.
console_out = push  af\n\
    p8con_busy:\n\
    ld  a,($37e8)\n\
    rlca\n\
    jr  c,p8con_busy\n\
    pop  af\n\
    ld  ($37e8),a\n\
    cp  10\n\
    jr  nz,p8con_out\n\
    ld  a,13\n\
    p8con_out:\n\
    jp  $0033
key_poll = jp  $002b
char_in = call  $0049\n\
    push  af\n\
    call  $0033\n\
    pop  af\n\
    cp  13\n\
    ret  nz\n\
    ld  a,10\n\
    ret

# A program with floats is linked by z88dk's zcc for this platform, with its
# 32-bit maths library (--math32) and the C source that all Z80 machines
# share.  A program without floats is made by z88dk's assembler alone.
zcc_platform = +trs80 -subtype=cmd -create-app -pragma-define:CRT_HEAP_AMALLOC=1 -pragma-define:CRT_HEAP_ENABLE=1
float_source = ../../lib/targets/z80/z80-float.c

# what -run runs, with {file} for the program (TRS80GP names the emulator
# when it is not in the path; -m1 is the Model I, -m3 the Model III)
run_command = tests/trs80run.sh {file}

# The modules: the trs80 target's (its textio is found through the list of
# directories of -srcdirs, which the test script gives), then llvm16's.
library = ../../lib/targets/llvm16
