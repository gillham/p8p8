# For p8p8's tests: the trs80m4 target (the TRS-80 Model 4 with its DOS) as
# it is run in the emulator trs80gp, like trs80gp.properties for the Model I
# and III: the program's output also goes to the printer (port $f8), and the
# program ends the emulator.
#   p8c -srcdirs lib/targets/trs80m4 -target tests/z80/trs80gp-m4.properties ...
base = ../../lib/targets/trs80m4/target.properties

exit_hook = ld  bc,0\n\
    ld  a,128\n\
    out  ($47),a

console_out = push  af\n\
    p8con_port:\n\
    in  a,($f8)\n\
    rlca\n\
    jr  c,p8con_port\n\
    pop  af\n\
    out  ($f8),a\n\
    cp  10\n\
    jr  nz,p8con_out\n\
    ld  a,13\n\
    p8con_out:\n\
    ld  c,a\n\
    ld  a,2\n\
    rst  $28\n\
    ret

float_source = ../../lib/targets/z80/z80-float.c
library = ../../lib/targets/llvm16
run_command = TRS80_MODEL=-m4 tests/trs80run.sh {file}
