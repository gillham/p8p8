# The coco3ram target for the tests (tests/cocorun.sh, make coco3ramcmp): as
# xroar-coco3-80.properties is for the coco3 target (the 80 column screen, a place to
# end at, what is printed kept from $5000 on), with the coco3ram target's own first
# instructions after those.  (WIDTH 80 is called through X: BASIC's blocks are still
# there, and a plain call would be taken as one to switch them in for.)
#
# Use: p8c -srcdirs lib/targets/coco3ram -target tests/m6809/xroar-coco3ram.properties ...

base = ../../lib/targets/coco3ram/target.properties
startup_code = fcb  $20,10\n\
    p8t_exit:\n\
    bra  p8t_exit\n\
    fcc  "P8P8TEST"\n\
    ldx  #$5000\n\
    stx  $4ffe\n\
    ldx  #$f679\n\
    jsr  ,x\n\
    ;high_loader\n\
    pshs  cc\n\
    orcc  #$50\n\
    ldx  $010d\n\
    stx  p8_irq_old\n\
    ldx  #p8_irq\n\
    stx  $010d\n\
    puls  cc
exit_code = jmp  p8t_exit
console_tap = pshs  x\n\
    ldx  $4ffe\n\
    sta  ,x+\n\
    stx  $4ffe\n\
    puls  x
library = ../../lib/targets/m6809
run_command = tests/cocorun.sh {file}
