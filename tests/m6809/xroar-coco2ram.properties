# The coco2ram target for the tests (the Color Computer 2 with 64 KB, the program with
# the ROMs switched out), as tests/m6809/xroar-coco2.properties is the coco2 target for
# them: the program's place to end at and its mark first, then the target's own first
# instructions; what is printed is kept from $5000 on.
#
# Use: p8c -srcdirs lib/targets/coco2ram -target tests/m6809/xroar-coco2ram.properties ...

base = ../../lib/targets/coco2ram/target.properties
startup_code = fcb  $20,10\n\
    p8t_exit:\n\
    bra  p8t_exit\n\
    fcc  "P8P8TEST"\n\
    ldx  #$5000\n\
    stx  $4ffe\n\
    pshs  cc\n\
    orcc  #$50\n\
    sta  $ffdf\n\
    ldb  $8000\n\
    lda  >$0000\n\
    pshs  a\n\
    comb\n\
    stb  $8000\n\
    cmpb  $8000\n\
    bne  p8ram_none\n\
    lda  >$0000\n\
    cmpa  ,s\n\
    bne  p8ram_none\n\
    comb\n\
    stb  $8000\n\
    leas  1,s\n\
    sta  $ffde\n\
    ldx  $010d\n\
    stx  p8_irq_old\n\
    ldx  #p8_irq\n\
    stx  $010d\n\
    puls  cc\n\
    bra  p8ram_go\n\
    p8ram_none:\n\
    comb\n\
    stb  $8000\n\
    leas  1,s\n\
    sta  $ffde\n\
    puls  cc\n\
    rts\n\
    p8ram_go:
exit_code = jmp  p8t_exit
console_tap = pshs  x\n\
    ldx  $4ffe\n\
    sta  ,x+\n\
    stx  $4ffe\n\
    puls  x
library = ../../lib/targets/m6809
run_command = tests/cocorun.sh {file}
