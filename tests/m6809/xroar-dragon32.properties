# The dragon32 target for the tests (tests/cocorun.sh, make cococmp): the Dragon 32
# as XRoar emulates it, unattended.  It is made from the library's dragon32 target (base),
# with three changes.  The program begins with a place of its own to end at, always at
# the same address ($0e02), where the emulator is told to stop (an XRoar trap); a
# mark after it says where the memory is in the emulator's snapshot.  And every
# character that is printed is kept as well, from $5000 on (the address of the next
# one is at $4ffe): that is what the test reads, as the screen has 16 lines only.
#
# Use: p8c -srcdirs lib/targets/dragon32 -target tests/m6809/xroar-dragon32.properties ...

base = ../../lib/targets/dragon32/target.properties
startup_code = fcb  $20,10\n\
    p8t_exit:\n\
    bra  p8t_exit\n\
    fcc  "P8P8TEST"\n\
    ldx  #$5000\n\
    stx  $4ffe
exit_code = jmp  p8t_exit
console_tap = pshs  x\n\
    ldx  $4ffe\n\
    sta  ,x+\n\
    stx  $4ffe\n\
    puls  x
library = ../../lib/targets/m6809
run_command = tests/cocorun.sh {file}
