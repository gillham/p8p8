# A machine described by a file, for "make test" ("target file"): the Commodore 64
# with another load address, other free zero page locations and code and symbols of
# its own, so that each key can be seen to arrive in the assembly p8p8 writes.
# docs/TARGETS.md describes the keys.

cpu = 6502
encoding = petscii
output_type = PRG
launcher = BASIC
load_address = $1201
memtop = $9000

zp_scratch_b1 = $02
zp_scratch_reg = $03
zp_scratch_w1 = $fb
zp_scratch_w2 = $fd
zp_scratch_ptr = $04

zp_fullsafe = $02-$ff
zp_kernalsafe = $40-$4f
zp_basicsafe = 0x60-0x62, 100, %01101000-$6a
virtual_registers = $cfe0

# the library of the upstream compiler's c64 target
library = lib/prog8lib/c64

asm_symbols = PROG8_C64_BANK_CONFIG=30\nVARIANT_MARK = 77
startup_code = ; the variant's own first lines\n    lda  #VARIANT_MARK\n    sta  $0400
exit_code = variant_exit:\n    rts
reset_address = variant_exit-1
assembler_options = --tab-size=1
